<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="罗盘">
<title>罗盘 · 二</title>
<style>
:root{--silver:#e8ebf2;--dim:#8d93a0;--line:rgba(220,226,240,.28)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background-color:#000}
html,body{height:100%;overflow:hidden;color:var(--silver);background-color:#000;
  background-image:radial-gradient(circle at 50% 36%,#0c0d14 0%,#030305 55%,#000 100%);
  font-family:"Noto Serif SC","Songti SC","STSong","Noto Serif CJK SC",serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#gl{z-index:1;pointer-events:none}
#scroller{position:fixed;inset:0;z-index:2;overflow-y:hidden;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#scroller.on{overflow-y:auto}
#scroller::-webkit-scrollbar{display:none}
#spacer{height:1500vh;width:1px}
#app{position:fixed;inset:0;pointer-events:none;z-index:3}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:18px 22px calc(24px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:14px;transition:opacity .9s ease,transform .9s ease;pointer-events:none}
.sheet button,.sheet select,.sheet input,.sheet label{pointer-events:auto}
.hide{opacity:0;transform:translateY(14px);pointer-events:none!important}
.hide *{pointer-events:none!important}
h1{font-weight:400;font-size:20px;letter-spacing:.7em;padding-left:.7em;text-shadow:0 0 14px rgba(220,230,255,.6)}
.sub{font-size:12px;color:var(--dim);letter-spacing:.16em;text-align:center}
.row{display:flex;gap:10px;width:100%;max-width:420px}
.row > *{flex:1;min-width:0}
select{appearance:none;-webkit-appearance:none;width:100%;height:44px;padding:0 12px;border-radius:12px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--silver);
  font:16px "Noto Serif SC","Songti SC",serif;text-align:center;text-align-last:center;outline:none}
select:focus{border-color:rgba(240,244,255,.7);box-shadow:0 0 12px rgba(200,215,255,.25)}
select option{background:#111;color:#eee}
.lab{font-size:11px;color:var(--dim);letter-spacing:.3em;text-align:center;margin-bottom:5px}
button{width:100%;max-width:420px;height:48px;border-radius:24px;border:1px solid rgba(240,244,255,.65);
  background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));color:#fff;
  font:17px "Noto Serif SC","Songti SC",serif;letter-spacing:.9em;padding-left:.9em;cursor:pointer;
  box-shadow:0 0 18px rgba(200,215,255,.22);transition:transform .15s}
button:active{transform:scale(.97)}
button.ghost{height:38px;width:auto;padding:0 22px 0 calc(22px + .5em);font-size:13px;letter-spacing:.5em;
  background:transparent;border-color:var(--line);box-shadow:none;color:var(--dim)}
.note{font-size:10.5px;color:#666b76;letter-spacing:.08em;text-align:center}
#result .cols{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:420px}
.col{text-align:center}
.col .t{font-size:11px;color:var(--dim);letter-spacing:.3em;padding-left:.3em;margin-bottom:6px}
.col .g{font-size:38px;line-height:1.15;text-shadow:0 0 16px rgba(220,230,255,.65);font-weight:600}
.col .e{font-size:11px;color:var(--dim);margin-top:1px;letter-spacing:.1em;height:15px}
.col.me .t{color:#fff}
#cap{font-size:13px;color:#b9bfcc;letter-spacing:.14em}
#redo{position:absolute;left:calc(8px + env(safe-area-inset-left));top:calc(8px + env(safe-area-inset-top));width:auto;height:30px;max-width:none;
  padding:0 12px 0 calc(12px + .25em);font-size:12px;letter-spacing:.25em;border-radius:15px;background:rgba(8,10,16,.55);
  border:1px solid rgba(200,215,245,.28);box-shadow:none;color:#c9d2e6;opacity:0;pointer-events:none;transition:opacity .6s;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#redo.on{opacity:1;pointer-events:auto}
#snd{position:absolute;right:8px;top:8px;width:auto;height:30px;max-width:none;padding:0 12px 0 calc(12px + .2em);font-size:12px;letter-spacing:.2em;
  border-radius:15px;background:rgba(8,10,16,.55);border:1px solid rgba(200,215,245,.28);box-shadow:none;color:#c9d2e6;pointer-events:auto;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#snd.off{color:#6f778a;border-color:rgba(200,215,245,.14)}
#card{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));border-radius:18px;padding:14px 16px 12px;
  border:1px solid rgba(160,200,255,.30);background:rgba(7,9,15,.74);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 0 34px rgba(110,165,255,.14),inset 0 0 22px rgba(150,190,255,.04);
  opacity:0;transform:translateY(18px);transition:opacity .5s,transform .5s;pointer-events:none}
#card.on{opacity:1;transform:none;pointer-events:auto}
#card .top{display:flex;justify-content:space-between;align-items:baseline}
#card .ttl{font-size:10px;letter-spacing:.28em;color:#9db8e2;font-family:Georgia,"Times New Roman",serif}
#card .yr{font-size:13px;letter-spacing:.2em;color:#cfd9ee}
#card .age{font-size:28px;letter-spacing:.14em;margin:6px 0 8px;text-shadow:0 0 18px rgba(190,220,255,.55);font-weight:600}
#card .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#card .k{font-size:10.5px;color:var(--dim);letter-spacing:.2em}
#card .v{font-size:22px;margin-top:2px;font-weight:600}
#card .tip{font-size:12px;color:#b4bccd;line-height:1.7;margin-top:2px;letter-spacing:.04em}
#card .tip b{color:#d7e6ff;font-weight:600}
#card .more{max-height:0;overflow:hidden;transition:max-height .55s ease;font-size:12px;line-height:1.75;color:#aab3c6}
#card.open .more{max-height:300px}
#card .more .r{padding:5px 0;border-top:1px solid rgba(200,215,245,.12)}
#card .more .r:first-child{margin-top:10px}
#card .more .r span{display:inline-block;min-width:4.4em;color:var(--dim);letter-spacing:.12em}
#card .more .r b{color:#e6edfb;font-weight:600}
#card .more .fine{font-size:10.5px;color:#6a7080;border-top:1px solid rgba(200,215,245,.12);padding-top:6px}
#card .hint{font-size:10.5px;color:#6f7686;text-align:center;margin-top:8px;letter-spacing:.2em}
#card .top{padding-right:28px}
#card.side{opacity:0;transform:translateX(calc(100% + 40px));pointer-events:none}
#cardX{position:absolute;right:6px;top:6px;width:30px;height:30px;max-width:none;padding:0;border:0;border-radius:15px;background:transparent;
  box-shadow:none;color:#9db8e2;display:grid;place-items:center;letter-spacing:0}
#cardX svg{width:11px;height:11px;stroke:currentColor;stroke-width:1.6;fill:none}
#top{position:absolute;right:calc(8px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));width:30px;height:30px;max-width:none;padding:0;
  border-radius:15px;background:rgba(8,10,16,.55);border:1px solid rgba(200,215,245,.28);box-shadow:none;color:#c9d2e6;letter-spacing:0;
  display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .6s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#top.on{opacity:1;pointer-events:auto}
#top svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.8;fill:none}
#tj{position:absolute;right:calc(12px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));width:46px;height:46px;max-width:none;padding:0;
  border-radius:50%;border:1px solid rgba(160,200,255,.35);background:rgba(7,9,15,.6);box-shadow:0 0 20px rgba(110,165,255,.28);letter-spacing:0;
  display:grid;place-items:center;opacity:0;transform:translateX(30px) scale(.6);pointer-events:none;transition:opacity .45s,transform .45s;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#tj.on{opacity:1;transform:none;pointer-events:auto}
#tj svg{width:30px;height:30px;animation:tjspin 9s linear infinite}
@keyframes tjspin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="gl"></canvas>
<div id="scroller"><div id="spacer"></div></div>
<div id="app">
  <button id="redo">换盘</button>
  <button id="top" aria-label="回到顶部"><svg viewBox="0 0 16 16"><path d="M8 14V2M3 7l5-5 5 5"/></svg></button>
  <button id="tj" aria-label="打开流年卡片"><svg viewBox="-16 -16 32 32"><circle r="15" fill="#f3f5fa"/><path d="M0-15A15 15 0 0 1 0 15A7.5 7.5 0 0 1 0 0A7.5 7.5 0 0 0 0-15Z" fill="#050508"/><circle cy="-7.5" r="2" fill="#050508"/><circle cy="7.5" r="2" fill="#f3f5fa"/><circle r="15" fill="none" stroke="#e8ebf2" stroke-width=".8"/></svg></button>
  <div id="card">
    <button id="cardX" aria-label="收起卡片"><svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1 1 11"/></svg></button>
    <div class="top"><div class="ttl">ANNUAL CYCLE · 流年年龄</div><div class="yr" id="c-year"></div></div>
    <div class="age" id="c-age"></div>
    <div class="grid">
      <div><div class="k">流年干支</div><div class="v" id="c-gz"></div></div>
      <div><div class="k">流年天干</div><div class="v" id="c-gan"></div></div>
      <div><div class="k">流年地支</div><div class="v" id="c-zhi"></div></div>
    </div>
    <div class="k" style="margin-top:10px">流年提示</div>
    <div class="tip" id="c-tip"></div>
    <div class="more" id="c-more"></div>
    <div class="hint" id="c-hint">轻点卡片展开详情</div>
  </div>
  <div class="sheet" id="form">
    <h1>起盘</h1>
    <div class="sub">输入出生时间，罗盘将为你转动</div>
    <div class="row">
      <div><div class="lab">年</div><select id="sy"></select></div>
      <div><div class="lab">月</div><select id="sm"></select></div>
      <div><div class="lab">日</div><select id="sd"></select></div>
    </div>
    <div style="width:100%;max-width:420px"><div class="lab">时辰</div><select id="sh"></select></div>
    <button id="go">起盘</button>
    <div class="note">按北京时间，以节气换算四柱 · 仅供文化娱乐参考</div>
  </div>
  <div class="sheet hide" id="endcta">
    <div class="note">全部流年已走完 · 左右拖动旋转 · 双指缩放 · 轻点树</div>
    <button class="ghost" id="again2">重新排盘</button>
  </div>
  <div class="sheet hide" id="result">
    <div id="cap"></div>
    <div class="cols" id="cols"></div>
    <div class="note">拖动圈层可转动罗盘 · 向下滑动，字将落成流年</div>
  </div>
</div>

<script src="three.min.js"></script>
<script>
(()=>{
/* ====================== 历法计算 ====================== */
/*CALC*/
const STEMS='甲乙丙丁戊己庚辛壬癸'.split('');
const BR='子丑寅卯辰巳午未申酉戌亥'.split('');
const EL_S='木木火火土土金金水水'.split('');
const EL_B='水土木木土火火土金金土水'.split('');
const D2R=Math.PI/180;
const mod=(a,n)=>((a%n)+n)%n;
function jdnOf(y,m,d){const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
  return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;}
function sunLon(jd){
  const T=(jd-2451545)/36525;
  const L0=280.46646+36000.76983*T+0.0003032*T*T;
  const M=(357.52911+35999.05029*T-0.0001537*T*T)*D2R;
  const C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);
  return mod(L0+C-0.00569-0.00478*Math.sin((125.04-1934.136*T)*D2R),360);
}
function bazi(Y,M,D,hr,late,hb){
  const jd=jdnOf(Y,M,D)-0.5+(hr-8)/24;
  const lam=sunLon(jd);
  let by=Y; if(M<=2&&lam<315) by=Y-1;
  const ys=mod(by-4,10), yb=mod(by-4,12);
  const mi=Math.floor(mod(lam-315,360)/30);
  const ms=(mod(ys,5)*2+2+mi)%10, mb=(2+mi)%12;
  let jdn=jdnOf(Y,M,D); if(late) jdn+=1;
  const di=mod(jdn-2451545+54,60), ds=di%10, db=di%12;
  const hs=(mod(ds,5)*2+hb)%10;
  return {year:[ys,yb],month:[ms,mb],day:[ds,db],hour:[hs,hb]};
}
const idx60=(s,b)=>{for(let i=0;i<60;i++) if(i%10===s&&i%12===b) return i; return 0;};
/*ENDCALC*/

/* ====================== 界面 ====================== */
const HOURS=[
  ['早子时 00:00–01:00',0.5,0,false],['丑时 01:00–03:00',2,1,false],['寅时 03:00–05:00',4,2,false],
  ['卯时 05:00–07:00',6,3,false],['辰时 07:00–09:00',8,4,false],['巳时 09:00–11:00',10,5,false],
  ['午时 11:00–13:00',12,6,false],['未时 13:00–15:00',14,7,false],['申时 15:00–17:00',16,8,false],
  ['酉时 17:00–19:00',18,9,false],['戌时 19:00–21:00',20,10,false],['亥时 21:00–23:00',22,11,false],
  ['晚子时 23:00–24:00',23.5,0,true]
];
const $=id=>document.getElementById(id);
const sy=$('sy'),sm=$('sm'),sd=$('sd'),sh=$('sh');
const THIS_YEAR=new Date().getFullYear();
for(let y=1900;y<=THIS_YEAR;y++) sy.add(new Option(y+'',y));
for(let m=1;m<=12;m++) sm.add(new Option(m+'',m));
HOURS.forEach((h,i)=>sh.add(new Option(h[0],i)));
function fillDays(){
  const y=+sy.value,m=+sm.value,keep=+sd.value||1,n=new Date(y,m,0).getDate();
  sd.innerHTML=''; for(let d=1;d<=n;d++) sd.add(new Option(d+'',d)); sd.value=Math.min(keep,n);
}
sy.value=1995; sm.value=6; fillDays(); sd.value=15; sh.value=6;
sy.onchange=sm.onchange=fillDays;

const EXTRA_STATIC='乾坤艮巽坎离震兑角亢氐房心尾箕斗牛女虚危室壁奎娄胃昴毕觜参井鬼柳星张翼轸癸壬庚辛戊己丙丁甲乙子丑寅卯辰巳午未申酉戌亥木火土金水0123456789年月日时柱主度流岁岁今出生虚岁同支六合六冲相害地支无冲合害十神四化宫位星曜与原局流年所落相关需要完整的紫微命盘目前尚未接入按八字规则推算取通行版本各流派略有差异仅供文化娱乐参考再点一次收起轻点卡片展开详情化禄权科忌廉贞破军武曲太阳天机梁阴同文昌巨门贪狼右弼曲左辅对日主王冠智慧理解慈悲严厉美丽胜利荣耀基础王国同辈自我合作与竞争劫财分担破耗食神才艺表达享受伤官创意突破口舌偏正机遇流动之稳定收入务实七杀压力挑战魄力规则职位责任门学习独处印贵人业庇护';
const CHARS=Array.from(new Set((document.getElementById('app').textContent+EXTRA_STATIC).replace(/\s/g,''))).join('');
const FONT='"Noto Serif SC","Songti SC","STSong","Noto Serif CJK SC",serif';
(()=>{const l=document.createElement('link');l.rel='stylesheet';
  l.href='https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap&text='+encodeURIComponent(CHARS);
  l.onload=()=>{Promise.race([document.fonts.load('600 16px "Noto Serif SC"',CHARS),new Promise(r=>setTimeout(r,2500))]).then(()=>{layout();});};
  l.onerror=()=>layout();
  document.head.appendChild(l);
  setTimeout(()=>{if(!caches.length)layout();},3200);
})();

/* ====================== 罗盘结构 ====================== */
const TOTAL=.78, TAU=Math.PI*2;
const RINGS=[
  {id:'taiji', r0:0,    r1:.10},
  {id:'bagua', r0:.115, r1:.195,n:8},
  {id:'shan',  r0:.205, r1:.28, n:24},
  {id:'hour',  r0:.29,  r1:.36, n:60},
  {id:'day',   r0:.37,  r1:.44, n:60},
  {id:'month', r0:.45,  r1:.52, n:60},
  {id:'year',  r0:.53,  r1:.60, n:60},
  {id:'xiu',   r0:.615, r1:.685,n:28},
  {id:'deg',   r0:.70,  r1:.77, n:360}
];
/* 水波从中心扩散，圈层随波前依次浮现 */
/* 每一圈从 RS 秒开始、用 RD 秒一格一格拼出来（单数圈顺时针、双数圈逆时针），边拼边转，到 END 停在你的那一格 */
const RS=[0,2.35,3.0,3.75,4.6,5.45,6.3,7.15,8.0];
const RD=[0,.6,.75,.95,.95,.95,.95,.85,1.0];
const START=RS;
const END  =[0,9.6,10.0,10.6,11.2,11.8,12.4,10.6,11.2];
const GROW=1.2, REVEAL=13.6, RIPPLE_V=.24;
const SHAN='子癸丑艮寅甲卯乙辰巽巳丙午丁未坤申庚酉辛戌乾亥壬'.split('');
const XIU='角亢氐房心尾箕斗牛女虚危室壁奎娄胃昴毕觜参井鬼柳星张翼轸'.split('');
const BAGUA=[['离',[1,0,1]],['坤',[0,0,0]],['兑',[1,1,0]],['乾',[1,1,1]],['坎',[0,1,0]],['艮',[0,0,1]],['震',[1,0,0]],['巽',[0,1,1]]];

const cv=$('c'),ctx=cv.getContext('2d'),scroller=$('scroller');
let W,H,DPR,CX,CY,S,caches=[],relaid=false;
function layout(){
  W=innerWidth;H=innerHeight;DPR=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  S=Math.min(W*.46,H*.32)/TOTAL; CX=W/2; CY=H*.345;
  caches=RINGS.map(d=>d.id==='taiji'?null:renderRing(d));
  taijiImg=renderTaiji();
  SP={};buildGlyphs();
  if(GLX.ok) GLX.resize();
  if(!TV.sr){TV.scx=W/2;TV.scy=H*.44;TV.sr=Math.min(W,H)*.4;}
}
addEventListener('resize',()=>{clearTimeout(layout.t);layout.t=setTimeout(layout,150);});
if(document.fonts) document.fonts.addEventListener('loadingdone',()=>{if(!relaid&&caches.length){relaid=true;layout();}});

let taijiImg=null;const TQ=3;
function renderTaiji(){
  const r=RINGS[0].r1*S*DPR*TQ,pad=6,size=Math.ceil(r*2+pad*2);
  const c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d');g.translate(size/2,size/2);
  const W1='#f3f5fa',B1='#050508';
  g.fillStyle=B1;g.beginPath();g.arc(0,0,r,0,6.283);g.fill();
  g.fillStyle=W1;g.beginPath();g.arc(0,0,r,Math.PI/2,Math.PI*1.5);g.closePath();g.fill();
  g.fillStyle=W1;g.beginPath();g.arc(0,-r/2,r/2,0,6.283);g.fill();
  g.fillStyle=B1;g.beginPath();g.arc(0,r/2,r/2,0,6.283);g.fill();
  g.fillStyle=B1;g.beginPath();g.arc(0,-r/2,r/8,0,6.283);g.fill();
  g.fillStyle=W1;g.beginPath();g.arc(0,r/2,r/8,0,6.283);g.fill();
  g.strokeStyle='#e8ebf2';g.lineWidth=.7*DPR*TQ;g.beginPath();g.arc(0,0,r-g.lineWidth/2,0,6.283);g.stroke();
  return c;
}
function put(g,ch,ang,r,size,weight){
  g.save();g.rotate(ang+Math.PI/2);g.font=(weight||400)+' '+size+'px '+FONT;
  g.textAlign='center';g.textBaseline='middle';g.fillText(ch,0,-r);g.restore();
}
function renderRing(def){
  const u=S*DPR,size=Math.ceil(def.r1*u*2+20*DPR);
  const c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d');g.translate(size/2,size/2);
  const SIL='#e8ebf2';
  g.strokeStyle=SIL;g.fillStyle=SIL;g.lineWidth=1.1*DPR;

/* ====================== 3D 相机 / 关键帧 ====================== */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo3=x=>1-Math.pow(1-x,3);
const ss=x=>x*x*(3-2*x);
const lerp=(a,b,t)=>a+(b-a)*t;
function kf(p,arr){
  if(p<=arr[0][0]) return arr[0][1];
  for(let i=1;i<arr.length;i++) if(p<=arr[i][0]){
    const a=arr[i-1],b=arr[i],x=(p-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*ss(x);}
  return arr[arr.length-1][1];

/* DNA 与流年的几何：第 k 年的横档在 y = Y0 + k*DY，向下是更晚的年份 */
let NR=60;const DY=.22, Y0=.4, SEG0=-1.4, SEG1=3.6;
let END_Y=Y0+(NR-1)*DY+1.6;
const P_END=.86;
const P_BROWSE=.5;
const K_TY=[[0,0],[.12,0],[.30,.9],[P_BROWSE,Y0]];
const K_DD=[[0,3.2],[.12,3.2],[.30,3.9],[.5,3.0],[1,3.0]];
const K_PI=[[0,0],[.12,0],[.24,.65],[.38,.12],[.5,.02],[1,.02]];
const K_YA=[[0,0],[.12,0],[.30,.45],[.5,.14],[1,.14]];
const K_TX=[[0,0],[.3,0],[.5,.3],[1,.3]];
const DD0=3.2;
const TREE={top:0,cy:0,dd:4};
function camState(p){
  let ty,dd,pi,ya,tx,dy=0;
  if(p<P_BROWSE){ty=kf(p,K_TY);dd=kf(p,K_DD);pi=kf(p,K_PI);ya=kf(p,K_YA);tx=kf(p,K_TX);}
  else{
    ty=Y0+clamp((p-P_BROWSE)/(P_END-P_BROWSE))*(NR-1)*DY;dd=3.0;pi=.02;ya=.14;tx=.3;
    if(p>P_END){
      const u=ss(clamp((p-P_END)/.09));
      TREE.dd=Math.max(S*DD0*3.95/(H*.84),S*DD0*3.2/(W*.98));
      ty=lerp(ty,TREE.cy,u);dd=lerp(dd,TREE.dd/TV.zoom,u);tx=lerp(tx,0,u);ya=lerp(ya,0,u);pi=lerp(pi,0,u);dy=lerp(0,H*.44-CY,u);
    }

  return {ty,tx,dd,dy,cyaw:Math.cos(ya),syaw:Math.sin(ya),cp:Math.cos(pi),sp:Math.sin(pi)};
}
function project(x,y,z,cs){
  const yy=y-cs.ty,xx=x-cs.tx;
  const x1=xx*cs.cyaw+z*cs.syaw, z1=-xx*cs.syaw+z*cs.cyaw;
  const y2=yy*cs.cp-z1*cs.sp, z2=yy*cs.sp+z1*cs.cp;
  const zc=z2+cs.dd, k=S*DD0/zc;

/* ====================== 字形粒子：罗盘 → DNA ====================== */
let GL=[];
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const NS=200, NRUNG=22, PER=6;               // 罗盘落下的字：每条链 200 个、22 档横档、每档 6 字
function buildGlyphs(){
  GL=[];
  for(let i=2;i<=7;i++){
    const def=RINGS[i],w=def.r1-def.r0,n=def.n;
    if(def.id==='shan') for(let j=0;j<24;j++) GL.push({ri:i,a0:-Math.PI/2+(j+.5)*TAU/n,r:def.r0+w*.5,sz:w*.5,ch:SHAN[j]});
    else if(def.id==='xiu') for(let j=0;j<28;j++) GL.push({ri:i,a0:-Math.PI/2+(j+.5)*TAU/n,r:def.r0+w*.5,sz:w*.52,ch:XIU[j]});
    else for(let j=0;j<60;j++){
      const a0=-Math.PI/2+(j+.5)*TAU/60;
      GL.push({ri:i,a0,r:def.r0+w*.72,sz:w*.42,ch:STEMS[j%10]});
      GL.push({ri:i,a0,r:def.r0+w*.28,sz:w*.42,ch:BR[j%12]});
    }
  }
  const R=rng(20261124),G=GL.length;
  const idx=Array.from({length:G},(_,i)=>i);
  for(let i=G-1;i>0;i--){const j=Math.floor(R()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  let ymin=1e9,ymax=-1e9;
  for(const g of GL){g.y0=Math.sin(g.a0)*g.r;ymin=Math.min(ymin,g.y0);ymax=Math.max(ymax,g.y0);}
  idx.forEach((gi,k)=>{
    const g=GL[gi];
    if(k<2*NS){g.kind=0;g.strand=k<NS?0:1;g.yy=SEG0+(((k%NS)+.5)/NS)*(SEG1-SEG0);}
    else{const q=k-2*NS;g.kind=1;g.rung=Math.floor(q/PER);g.j=q%PER;}
    g.d=clamp((1-(g.y0-ymin)/(ymax-ymin))*.75+R()*.25);

  const pool=(STEMS.join('')+BR.join('')+SHAN.join('')+XIU.join('')).split('');
  const pick=()=>pool[Math.floor(R()*pool.length)];
  for(let sd=0;sd<2;sd++) for(let y=SEG1;y<=END_Y;y+=(SEG1-SEG0)/NS)
    GL.push({extra:true,kind:0,strand:sd,yy:y,ch:pick(),endSz:.055});
  for(let k=NRUNG;k<NR;k++) for(let j=0;j<PER;j++)
    GL.push({extra:true,kind:1,rung:k,j,ch:pick(),endSz:.048});
  for(let i=0;i<2300;i++) GL.push({extra:true,treeOnly:true,kind:0,ch:pick(),endSz:.04});

}

/* ====================== 结尾：生命之树 ====================== */
const TREE_H=4.2;

  const G=TREE.top+TREE_H*.6;TREE.ground=G;TREE.cy=G-.78;

    const n=Math.max(1,Math.round(L/sp));

        out.push({x:lerp(A[0],B[0],t)+ox,y:lerp(A[1],B[1],t)+oy,z:lerp(A[2],B[2],t)+oz,lvl,
          f:{x0:A[0],y0:A[1],z0:A[2],x1:B[0],y1:B[1],z1:B[2],ox,oy,oz,t:t+(R()-.5)/n,L,spd:spd*(.7+R()*.6)}});

  const idx=Array.from({length:GL.length},(_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}
  idx.forEach((gi,n)=>{
    const g=GL[gi];

    g.dr=sl.leaf&&R()<.09?(R()<.5?-1:1)*(.03+R()*.05):0;g.dd=.4+R()*.5;
    if(g.treeOnly){g.sx=(R()-.5)*3.2;g.sy=TREE.top-2.5-R()*2.5;g.sz0=(R()-.5)*1.6;}
    g.td=clamp(Math.hypot(sl.x,sl.y-G,sl.z)/2.6*.7+R()*.3);

  STREAM.length=0;RPULSE.length=0;

  for(let i=0;i<200;i++) STREAM.push({ch:pool[Math.floor(R()*pool.length)],ph:R(),sp:.03+R()*.035,ang:R()*TAU,

/* 沿折线取点，u∈[0,1] */
function alongPath(P,u){

/* ====================== 配乐：全部用 Web Audio 现场合成，不用任何音频文件 ======================
   底层是 D 小调五声音阶的低音长音（D、A），随机落下的钟磬声；
   墨滴入水有一声「滴」，每圈落定一声磬，翻到新的一年一声轻铃，点树时一串泛音。 */

function bell(f,vel,when,dec){

  if(!AU.noise){const n=c.sampleRate*2,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++) d[i]=Math.random()*2-1;AU.noise=b;}

/* ---- 火花 ---- */
const curT=()=>mode==='idle'?-1:(performance.now()-t0)/1000;
const IDLE_CAM=2.3;
const camAt=t=>t<.7?IDLE_CAM:1+(IDLE_CAM-1)*Math.pow(1-clamp((t-.7)/6.8),2);
/* ====================== 点云粒子 ======================
   成千上万颗极细的点，被一股缓慢流动的"气流"带着走，聚成一缕一缕；
   少数是拖着短尾巴的亮丝，少数是近处虚焦的大光斑。 */
const FXMAX=8000;
const gss=()=>(Math.random()+Math.random()+Math.random()-1.5)/1.5;
function fine(x,y,vx,vy,life,keep){
  const r=Math.random(),k=r<.03?1:r<.07?2:0;
  const q={x,y,vx,vy,life,max:life,k,b:Math.random()<.4,ph:Math.random()*TAU,fl:.5+Math.random(),
    sz:k===2?1.6+Math.random()*2.6:.4+Math.pow(Math.random(),2.6)*.75};
  /* 树周围的点云：不消散，绕着出生时要去的位置慢慢飘 */
  if(keep){q.keep=true;q.age=0;q.fl*=.45;q.sz=k===2?q.sz:.55+Math.pow(Math.random(),2.4)*.9;q.ax=clamp(x+vx*.5,-10,W+10);q.ay=clamp(y+vy*.5,0,H);TV.hasCloud=true;}
  sparks.push(q);
}
function burstRing(r,n,speed){
  const cam=camAt(curT());
  for(let i=0;i<n*16;i++){const a=Math.random()*6.283,rr=r*S*cam*(1+gss()*.03),sp=speed*(.1+Math.pow(Math.random(),1.7)*1.4),tg=gss()*speed*.6;
    fine(CX+Math.cos(a)*rr,CY+Math.sin(a)*rr,Math.cos(a)*sp-Math.sin(a)*tg,Math.sin(a)*sp+Math.cos(a)*tg,2+Math.random()*2.5);}
}
function burstAt(x,y,n){
  for(let i=0;i<n*18;i++){const a=Math.random()*6.283,sp=8+Math.pow(Math.random(),1.8)*170,d=Math.abs(gss())*9;
    fine(x+Math.cos(a)*d,y+Math.sin(a)*d,Math.cos(a)*sp,Math.sin(a)*sp,1.8+Math.random()*2.6);}
}
/* 树转圈开始：一团点云绕着树卷起来 */
function treeBurst(){
  for(let i=0;i<3000;i++){const a=Math.random()*TAU,rr=TV.sr*(.55+Math.pow(Math.random(),.6)*.8),sp=60+Math.pow(Math.random(),1.3)*220;
    fine(TV.scx+Math.cos(a)*rr,TV.scy+Math.sin(a)*rr*.75+gss()*20,-Math.sin(a)*sp+Math.cos(a)*sp*.25,Math.cos(a)*sp*.55+Math.sin(a)*sp*.2-30,3,true);}
}
/* 气流：几层慢慢变化的正弦叠在一起，粒子顺着它飘成丝 */
function flowStep(q,dt,t){
  const fx=Math.sin(q.y*.013+t*.7+q.ph*.3)+Math.sin((q.x+q.y)*.006-t*.45)+.5*Math.sin(q.y*.031-t*1.1);
  const fy=Math.cos(q.x*.012-t*.55)+Math.cos((q.x-q.y)*.007+t*.35)+.5*Math.cos(q.x*.029+t*.9);
  const F=58*q.fl,dr=Math.exp(-dt*1.15);
  q.vx=(q.vx+fx*F*dt)*dr;q.vy=(q.vy+fy*F*dt)*dr;q.x+=q.vx*dt;q.y+=q.vy*dt;
}
function drawFX(now,dt){
  if(sparks.length>FXMAX) sparks.splice(0,sparks.length-FXMAX);
  const t=now/1000;
  for(let i=sparks.length-1;i>=0;i--){
    const q=sparks[i];let a;
    if(q.keep){
      q.age+=dt;q.vx+=(q.ax-q.x)*1.3*dt;q.vy+=(q.ay-q.y)*1.3*dt;flowStep(q,dt,t);
      a=Math.min(1,q.age*2.5)*(.78+.22*Math.sin(t*2.6+q.ph));
    }else{
      q.life-=dt;if(q.life<=0){sparks.splice(i,1);continue;}
      flowStep(q,dt,t);
      const u=q.life/q.max;a=Math.min(1,(1-u)*10)*Math.pow(u,.85)*(.75+.25*Math.sin(t*9+q.ph));
    }
    if(a<.01||q.x<-20||q.x>W+20||q.y<-20||q.y>H+20) continue;
    if(q.k===1){                                   // 亮丝：顺着速度拖一条短尾巴
      ctx.globalAlpha=a*.8;ctx.strokeStyle=q.b?'#a9cbff':'#ffffff';ctx.lineWidth=.6;
      ctx.beginPath();ctx.moveTo(q.x-q.vx*.028,q.y-q.vy*.028);ctx.lineTo(q.x,q.y);ctx.stroke();
      ctx.fillStyle='#ffffff';ctx.fillRect(q.x-.45,q.y-.45,.9,.9);
    }else if(q.k===2){                             // 近处虚焦的光斑
      ctx.globalAlpha=a*.12;ctx.fillStyle='#b4cfff';ctx.beginPath();ctx.arc(q.x,q.y,q.sz,0,6.283);ctx.fill();
    }else{                                         // 点云里的小点
      ctx.globalAlpha=Math.min(1,a*.95);ctx.fillStyle=q.b?'#9fc3ff':'#e6edff';ctx.fillRect(q.x-q.sz*.5,q.y-q.sz*.5,q.sz,q.sz);
    }
  }
}
function star(x,y,s,a,calm){
  ctx.globalAlpha=a;ctx.fillStyle='#f4f7ff';
  ctx.beginPath();ctx.arc(x,y,s,0,6.283);ctx.fill();
  if(s>1.5&&!calm){ctx.strokeStyle='#f4f7ff';ctx.lineWidth=.6;ctx.beginPath();
    ctx.moveTo(x-s*3.2,y);ctx.lineTo(x+s*3.2,y);ctx.moveTo(x,y-s*3.2);ctx.lineTo(x,y+s*3.2);ctx.stroke();}
}

/* ---- 各圈当前转角 ---- */
function ringRot(i,t){
  const def=RINGS[i],u=clamp((t-START[i])/(END[i]-START[i]));
  const dir=i%2?1:-1,spins=.5+.045*i;
  const isP=targets[def.id]!==undefined;
  const target=isP?-(targets[def.id]+.5)*TAU/60:0;
  let rot;
  if(t<END[i]) rot=target+dir*spins*TAU*(1-eo3(u));
  else{
    const tau=t-END[i],d=2,x=Math.min(tau/d,1);
    const integ=x<1?d*(x*x*x-x*x*x*x/2):d*.5+(tau-d);
    rot=target+dir*(.04+.007*i)*integ;
  }
  return rot+userRot[i]+SPIN.a*(i%2?1:-1)*(.7+.13*i);
}

/* ---- 太极出场：墨滴落在白点上 ---- */
function drawDisk(r,glow){
  ctx.save();ctx.shadowColor='rgba(215,228,255,.95)';ctx.shadowBlur=glow;
  ctx.fillStyle='#f3f5fa';ctx.beginPath();ctx.arc(0,0,r,0,6.283);ctx.fill();ctx.restore();
}
/* 墨丝：从落点向外卷曲伸展的几缕，像墨滴进水里 */
const INK=(()=>{const R=rng(4242),a=[];for(let j=0;j<11;j++) a.push({a:j/11*TAU+(R()-.5)*.5,c:(R()-.5)*3.2,L:.55+R()*.75,w:.06+R()*.09,d:R()*.25});return a;})();
function inkBlob(x,y,rad,al){
  const g=ctx.createRadialGradient(x,y,0,x,y,rad);
  g.addColorStop(0,'rgba(5,5,8,'+al+')');g.addColorStop(.55,'rgba(10,10,16,'+(al*.55)+')');g.addColorStop(1,'rgba(20,20,28,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,rad,0,6.283);ctx.fill();
}
function drawIntro(t,now){
  const r=RINGS[0].r1*S;
  if(t<0){drawDisk(r,16+8*Math.sin(now/700));return;}
  if(t<.9){
    drawDisk(r,16);
    /* 墨滴：上尖下圆，越落越快，中心浓、边缘略透 */
    const k=t/.9,y=-1.0*S*(1-k*k)+r/2*(k*k),rr=r*.17,st=1+.9*k;
    ctx.save();ctx.translate(0,y);
    const g=ctx.createRadialGradient(-rr*.25,rr*.2,0,0,0,rr*st*1.1);
    g.addColorStop(0,'#000');g.addColorStop(.75,'#07070b');g.addColorStop(1,'rgba(20,20,30,.6)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,-rr*st*1.6);
    ctx.bezierCurveTo(rr*.9,-rr*st*.4,rr,rr*st*.5,0,rr*st);ctx.bezierCurveTo(-rr,rr*st*.5,-rr*.9,-rr*st*.4,0,-rr*st*1.6);ctx.fill();
    ctx.strokeStyle='rgba(225,232,250,.55)';ctx.lineWidth=.8;ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(-rr*.3,rr*st*.1,rr*.14,rr*.24,-.4,0,6.283);ctx.fill();
    ctx.restore();
    return;
  }
  const k=eo3(clamp((t-.9)/1.45)),kt=eo3(clamp((t-1.75)/.65));
  const k1=eo3(clamp((t-.9)/1.05)),inkA=1-ss(clamp((t-1.75)/.75)),ix=0,iy=r/2;
  drawDisk(r,16);
  ctx.save();
  ctx.beginPath();ctx.arc(0,0,r,0,6.283);ctx.clip();
  /* 落点：一圈淡淡的墨晕向外推开 */
  if(inkA>.01){
    const sr=r*(.15+k1*.9);
    const g=ctx.createRadialGradient(ix,iy,sr*.55,ix,iy,sr);
    g.addColorStop(0,'rgba(8,8,12,0)');g.addColorStop(.7,'rgba(8,8,12,'+(.22*inkA*(1-k1*.6))+')');g.addColorStop(1,'rgba(8,8,12,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(ix,iy,sr,0,6.283);ctx.fill();
    inkBlob(ix,iy,r*(.18+.12*k1),.85*inkA);
    /* 墨丝：沿着卷曲的路径一路晕开，越往外越细越淡 */
    for(const q of INK){
      const len=clamp((k1-q.d)/(1-q.d));if(len<=0) continue;
      for(let m=0;m<34;m++){
        const u=m/33*len,ang=q.a+q.c*u*u,dist=u*q.L*r,wv=Math.sin(u*9+q.c*3)*.06*r*u;
        const x=ix+Math.cos(ang)*dist-Math.sin(ang)*wv,y=iy+(Math.sin(ang)*dist+Math.cos(ang)*wv)*.9;
        inkBlob(x,y,r*q.w*(1.3-u*.9)*(.75+.5*k1),.2*inkA*(1-u*.6));
      }
    }
  }
  /* 墨慢慢收拢成太极：外面先晕一层，再是实的形状 */
  const sc=.12+.88*k,th=-(1-k)*2.6,wob=1+.08*Math.sin(k*Math.PI)*Math.sin(t*9);
  const yin=()=>{ctx.beginPath();ctx.arc(0,0,r,-Math.PI/2,Math.PI/2,false);ctx.arc(0,r/2,r/2,Math.PI/2,Math.PI*1.5,false);ctx.arc(0,-r/2,r/2,Math.PI/2,-Math.PI/2,true);ctx.closePath();};
  ctx.save();
  ctx.translate(0,r/2*(1-k));ctx.rotate(th);ctx.scale(sc*wob,sc/wob);
  ctx.save();ctx.scale(1.06,1.06);ctx.fillStyle='rgba(5,5,8,'+(.25*(1-kt*.6))+')';yin();ctx.fill();ctx.restore();
  ctx.fillStyle='rgba(5,5,8,'+(.55+.45*k)+')';yin();ctx.fill();
  ctx.restore();
  ctx.fillStyle='#f3f5fa';ctx.beginPath();ctx.arc(0,r/2,r/8*kt,0,6.283);ctx.fill();
  ctx.fillStyle='#050508';ctx.beginPath();ctx.arc(0,-r/2,r/8*kt,0,6.283);ctx.fill();
  ctx.restore();
  ctx.strokeStyle='#e8ebf2';ctx.lineWidth=.7;ctx.beginPath();ctx.arc(0,0,r-.35,0,6.283);ctx.stroke();
}

/* ====================== 主循环 ====================== */
let lastHud='';
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!W||!caches.length) return;
  const t=mode==='idle'?-1:(now-t0)/1000;

  /* 滚动进度 */
  if(mode==='run'){
    const max=scroller.scrollHeight-scroller.clientHeight;
    P=max>0?clamp(scroller.scrollTop/max):0;
    if(!revealed){ if(P>.004) t0-=dt*1000*7; P=Math.min(P,.1); }
  }else P=0;
  if(mode==='run') $('redo').classList.toggle('on',(now-t0)/1000>2.6);
  if(mode==='run'&&!AU.plopped&&(now-t0)/1000>.88){AU.plopped=true;plop();}
  auTick(Pc,mode);
  Pc+=(P-Pc)*Math.min(1,dt*7);
  const p=Pc;
  const cs=camState(p);
  if(mode==='run') $('top').classList.toggle('on',revealed&&p>.03);

  /* 往下滑：罗盘被滑动带着飞速转动，松手后靠惯性慢慢停下 */
  const dpp=p-SPIN.prev;SPIN.prev=p;
  const slow=ss(clamp((p-.07)/.13));               // 0：还在罗盘；1：已经在变成 DNA
  if(mode==='run'&&revealed){SPIN.a+=dpp*120*(1-slow);SPIN.v=clamp(SPIN.v+dpp*520*(1-slow),-34,34);}
  SPIN.v*=Math.exp(-dt*(1.4+5*slow));SPIN.a+=SPIN.v*dt;

  /* 滑到树的那一页：树自己快速转一圈，周围散开细粒子、亮起粒子环 */
  if(mode==='run'&&p>P_END+.1&&TV.armed){TV.armed=false;TV.spinT=now;TV.spinDone=0;if(!GLX.ok)treeBurst();}
  if(p<P_END+.04){TV.armed=true;
    if(TV.hasCloud){TV.hasCloud=false;for(const q of sparks) if(q.keep){q.keep=false;q.max=q.life=.6+Math.random()*.6;}}}
  let orbT=p>P_END+.08?.18:0;
  if(TV.spinT){
    const u=clamp((now-TV.spinT)/1700),e=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2,tg=TAU*e;
    TV.yaw+=tg-TV.spinDone;TV.spinDone=tg;orbT=1;
    if(u<.9&&!GLX.ok) for(let i=0;i<26;i++){const a=Math.random()*TAU,rr=TV.sr*(.6+Math.random()*.7),sp=80+Math.random()*180;
      fine(TV.scx+Math.cos(a)*rr,TV.scy+Math.sin(a)*rr*.75+gss()*24,-Math.sin(a)*sp,Math.cos(a)*sp*.55-25,3,true);}
    if(u>=1) TV.spinT=0;
  }
  TV.orbA=(TV.orbA||0)+(orbT-(TV.orbA||0))*Math.min(1,dt*(orbT>(TV.orbA||0)?6:1.2));
  const intro=mode==='idle'?1+.015*Math.sin(now/900)*0+0:camAt(t);
  const camI=mode==='idle'?IDLE_CAM:intro;

  /* 惯性 */
  if(!tdrag){TV.yaw+=TV.vy*dt;TV.vy*=Math.exp(-dt*1.8);}
  TV.hov+=((TV.hovOn?1:0)-TV.hov)*Math.min(1,dt*6);
  for(let i=TV.bursts.length-1;i>=0;i--) if(now-TV.bursts[i].t>2700) TV.bursts.splice(i,1);
  for(let i=1;i<RINGS.length;i++){ if(!drag&&Math.abs(spin[i])>.001){userRot[i]+=spin[i]*dt;spin[i]*=Math.exp(-dt*2.2);} }

  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  const blk=GLX.ok?ss(clamp((p-P_END-.07)/.08)):0;
  if(blk>.002){ctx.globalAlpha=blk;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}

  /* 星尘：随镜头视差移动 */
  ctx.globalCompositeOperation='lighter';
  for(const s of stars){
    const x=s.x*W+Math.sin(now/3000*s.ts+s.ph)*6;
    let y=s.y*H-cs.ty*S*.16*s.d+now*.0009*s.d;
    y=mod(y,H+60)-30;
    const tw=.3+.7*(.5+.5*Math.sin(now/1000*s.ts+s.ph));
    star(x,y,blk>.5?s.size*.6:s.size,s.base*tw*.9*(1-.6*blk),blk>.5);
  }
  drawFX(now,dt);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;

  /* —— 罗盘本体（第一幕） —— */
  const ringA=1-ss(clamp((p-.12)/.04));
  if(ringA>.002){
    const c0=project(0,0,0,cs),kx=c0[2]/S*cs.cyaw*camI,ky=c0[2]/S*cs.cp*camI;
    ctx.setTransform(DPR*kx,0,0,DPR*ky,c0[0]*DPR,c0[1]*DPR);
    ctx.globalAlpha=ringA;
    const tr=RINGS[0].r1*S;
    if(mode==='idle'||t<2.4){ drawIntro(t,now); }
    else{
      taiRot+=dt*(t<9?.7:Math.max(.15,.7-(t-9)*.25));
      ctx.save();ctx.rotate(taiRot+SPIN.a*1.6);ctx.shadowColor='rgba(215,228,255,.95)';ctx.shadowBlur=14;
      const w=taijiImg.width/(DPR*TQ);ctx.drawImage(taijiImg,-w/2,-w/2,w,w);ctx.restore();
    }
    if(mode!=='idle'&&t>=0.9){          // 水波
      for(let k=0;k<3;k++){
        const R=(t-1.0-.5*k)*RIPPLE_V*S;
        if(R>0&&R<.92*S){ctx.save();ctx.globalAlpha=ringA*.5*(1-R/(.92*S));
          ctx.strokeStyle='#dfe6f7';ctx.lineWidth=1.2;ctx.shadowColor='rgba(210,225,255,1)';ctx.shadowBlur=8;
          ctx.beginPath();ctx.arc(0,0,R,0,6.283);ctx.stroke();ctx.restore();}
      }
    }
    if(mode!=='idle'){
      for(let i=1;i<RINGS.length;i++){
        const def=RINGS[i],prog=clamp((t-RS[i])/RD[i]);
        if(prog<=0) continue;
        const rot=ringRot(i,t),key=def.id,isP=targets[key]!==undefined;
        const img=caches[i],iw=img.width/DPR,ih=img.height/DPR;
        ctx.save();ctx.globalAlpha=ringA;ctx.rotate(rot);
        if(prog>=1) ctx.drawImage(img,-iw/2,-ih/2,iw,ih);
        else{
          /* 拼接：已经拼好的格子整块画出，正在拼的那一格淡入 */
          const n=def.n===360?72:def.n,step=TAU/n,cnt=prog*n,full=Math.floor(cnt),fr=cnt-full,dir=i%2?1:-1,a0=-Math.PI/2,RR=def.r1*S*1.3;
          const wedge=(A,B)=>{ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,RR,A,B,dir<0);ctx.closePath();ctx.clip();};
          if(full>0){ctx.save();wedge(a0,a0+dir*full*step);ctx.drawImage(img,-iw/2,-ih/2,iw,ih);ctx.restore();}
          if(fr>0){ctx.save();wedge(a0+dir*full*step,a0+dir*(full+1)*step);ctx.globalAlpha=ringA*fr;ctx.drawImage(img,-iw/2,-ih/2,iw,ih);ctx.restore();}
          /* 每拼上一格，格子上闪出几颗细光点 */
          if(full>(spawned[i]|0)){
            const rm=(def.r0+def.r1)/2*S,ang=a0+dir*(full-.5)*step+rot;
            for(let m=0;m<3;m++) fine(c0[0]+Math.cos(ang)*rm*kx,c0[1]+Math.sin(ang)*rm*ky,(Math.random()-.5)*60,(Math.random()-.5)*60,.6+Math.random()*.8);
            spawned[i]=full;
          }
          /* 拼接的那条边：一道细亮线 */
          const ea=a0+dir*cnt*step;ctx.globalAlpha=ringA*.8;ctx.strokeStyle='#ffffff';ctx.lineWidth=1.2;
          ctx.beginPath();ctx.moveTo(Math.cos(ea)*def.r0*S,Math.sin(ea)*def.r0*S);ctx.lineTo(Math.cos(ea)*def.r1*S,Math.sin(ea)*def.r1*S);ctx.stroke();
          ctx.globalAlpha=ringA;
        }
        if(isP&&t>=END[i]){
          if(!landed[i]){landed[i]=true;burstAt(CX,CY-(def.r0+def.r1)/2*S*camI,36);}
          const k=clamp((t-END[i])/.8),half=Math.PI/def.n;
          const c1=-Math.PI/2+(targets[key]+.5)*TAU/60;
          ctx.beginPath();
          ctx.arc(0,0,def.r1*S,c1-half,c1+half);
          ctx.arc(0,0,def.r0*S,c1+half,c1-half,true);ctx.closePath();
          ctx.fillStyle='rgba(255,255,255,'+(k*(.26+.10*Math.sin(now/260)))+')';ctx.fill();
          ctx.strokeStyle='rgba(255,255,255,'+k+')';ctx.lineWidth=1.6;
          ctx.shadowColor='rgba(225,235,255,1)';ctx.shadowBlur=12;ctx.stroke();
        }
        ctx.restore();
      }
      const la=clamp((t-6.2)/1.2)*ringA;
      if(la>0){
        ctx.save();ctx.globalAlpha=la*.75;ctx.strokeStyle='#fff';ctx.lineWidth=1.2;
        ctx.shadowColor='rgba(220,232,255,1)';ctx.shadowBlur=8;
        ctx.beginPath();ctx.moveTo(0,-.1*S);ctx.lineTo(0,-.80*S);ctx.stroke();
        ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(-5,-.835*S);ctx.lineTo(5,-.835*S);ctx.lineTo(0,-.80*S);ctx.closePath();ctx.fill();
        ctx.restore();
      }
    }
    ctx.globalAlpha=1;
    const sv=Math.abs(SPIN.v);
    if(mode==='run'&&revealed&&sv>4&&ringA>.3){
      const n=Math.min(36,6+Math.floor(sv*1.2)),Rr=RINGS[8].r1*S*kx,dir=-Math.sign(SPIN.v);
      for(let i=0;i<n;i++){const a=Math.random()*TAU,sp=50+sv*8*Math.random(),rr=Rr*(1+gss()*.04);
        fine(c0[0]+Math.cos(a)*rr,c0[1]+Math.sin(a)*rr*ky/kx,-Math.sin(a)*sp*dir+Math.cos(a)*30,Math.cos(a)*sp*dir+Math.sin(a)*30,1+Math.random()*1.6);}
    }
  }

  /* —— 第二、三幕：字落成链 → 梯子 —— */
  if(mode==='run'&&revealed&&p>.115) drawStory(now,t,p,cs,dt);

  if(GLX.ok) GLX.frame(now,p,cs);

  /* 面板 / HUD */
  if(mode==='run'&&!revealed&&t>REVEAL){revealed=true;$('result').classList.remove('hide');}
  if(revealed){
    const o=1-ss(clamp(p/.06));
    $('result').style.opacity=o.toFixed(3);
$('endcta').classList.toggle('hide',!(p>.975));
    if(p<P_BROWSE-.03){$('card').classList.remove('on');$('tj').classList.remove('on');}
  }
}

function drawStory(now,t,p,cs,dt){
  const secs=now/1000;
  const assemble=ss(clamp((p-.24)/.2));
  const dnaA=1-ss(clamp((p-P_END)/.06));
  const browseA=ss(clamp((p-.47)/.06))*(1-ss(clamp((p-(P_END-.02))/.04)));
  const F=p>=P_BROWSE?clamp((p-P_BROWSE)/(P_END-P_BROWSE))*(NR-1):0;
  const cur=Math.round(F),yF=Y0+F*DY;
  const B=clamp((p-.12)/.30);
  const gA=ss(clamp((p-.12)/.03)),exA=ss(clamp((p-.36)/.1));
  const R=lerp(.66,.34,assemble),spinA=secs*.35+p*8,TW=assemble*TAU/1.6;
  const strandPt=(sd,y)=>{const th=Math.PI+(sd?Math.PI:0)+spinA+TW*y;return [R*Math.cos(th),y,R*Math.sin(th)];};
  ctx.setTransform(DPR,0,0,DPR,0,0);

  /* 逐年点亮：当前年份升到最亮，上一年的光效缓缓退去 */
  if(browseA>.5){
    if(cur!==lastCur){
      if(lastCur>=0){ for(let i=0;i<12;i++) conv.push({a:Math.random()*TAU,r0:34+Math.random()*26,t0:now,d:520+Math.random()*180}); }
      
      lastCur=cur;visitedMax=Math.max(visitedMax,cur);updateCard(cur);
    }
    $('card').classList.add('on');$('tj').classList.toggle('on',cardHidden);
  }else{$('card').classList.remove('on');$('tj').classList.remove('on');}
  for(let k=0;k<NR;k++){
    const target=(k===lastCur&&browseA>.5)?1:0;
    lit[k]+=(target-lit[k])*Math.min(1,dt*(target>lit[k]?10:1.7));
  }
  const yearA=k=>{ // 暗灰白(未经过) → 中等银白(已经过) → 明亮银白(当前)
    const base=k<=visitedMax?.58:.30,a=base+(1-base)*lit[k];
    return lerp(1,a,browseA);
  };
  /* 点击年份的光效 */
  let fl=0,fy=0;
  if(flash){const age=(now-flash.t0)/1000;if(age>1.6)flash=null;else{fl=Math.exp(-age*2.3)*Math.min(1,age*12);fy=Y0+flash.k*DY;}}
  const tintAt=y=>{ // 冷蓝高亮权重：当前年附近 + 点击光效
    let w=0;
    if(browseA>.02) w=Math.pow(Math.max(0,1-Math.abs(y-yF)/.55),1.6)*browseA;
    if(fl>.01) w=Math.max(w,fl*Math.max(0,1-Math.abs(y-fy)/1.0));
    return w;
  };

  /* 双链与交叉光点 */
  const sa=ss(clamp((p-.26)/.1))*dnaA;
  if(sa>.01){
    const N=Math.round((END_Y-SEG0)/.1);
    const pa=[],pb=[];
    for(let i=0;i<=N;i++){const y=SEG0+(END_Y-SEG0)*i/N;
      pa.push(project(...strandPt(0,y),cs));pb.push(project(...strandPt(1,y),cs));}
    ctx.save();ctx.lineWidth=1;ctx.strokeStyle='rgba(215,225,248,'+(.22*sa)+')';
    ctx.shadowColor='rgba(200,215,255,.7)';ctx.shadowBlur=4;
    for(const arr of [pa,pb]){ctx.beginPath();let f=true;
      for(const q of arr){if(q[3]<.3)continue;if(f){ctx.moveTo(q[0],q[1]);f=false;}else ctx.lineTo(q[0],q[1]);}
      ctx.stroke();}
    /* 当前年份 / 点击年份附近的链段发出冷蓝光 */
    for(const arr of [pa,pb]){
      ctx.beginPath();let f=true,any=false;
      for(let i=0;i<=N;i++){const y=SEG0+(END_Y-SEG0)*i/N,w=tintAt(y);
        if(w<.05){f=true;continue;}
        const q=arr[i];if(f){ctx.moveTo(q[0],q[1]);f=false;}else ctx.lineTo(q[0],q[1]);any=true;}
      if(any){ctx.strokeStyle='rgba(165,208,255,'+Math.min(.9,.35+.6*Math.max(browseA*.6,fl))+')';ctx.lineWidth=1.8;
        ctx.shadowColor='rgba(120,180,255,1)';ctx.shadowBlur=10;ctx.stroke();}
    }
    ctx.restore();
    /* 螺旋交叉处偶尔闪一下 */
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(let i=1;i<=N;i++){
      const d0=pa[i-1][0]-pb[i-1][0],d1=pa[i][0]-pb[i][0];
      if(d0*d1<0){
        const y=SEG0+(END_Y-SEG0)*i/N,q=pa[i];
        if(q[1]<-20||q[1]>H+20) continue;
        const pulse=Math.pow(.5+.5*Math.sin(secs*1.25+y*3.1),8);
        if(pulse<.05) continue;
        ctx.globalAlpha=sa*pulse*.7;
        const r=Math.max(2,.012*q[2]*(1+pulse));
        const gr=ctx.createRadialGradient(q[0],q[1],0,q[0],q[1],r*2.4);
        gr.addColorStop(0,'rgba(240,248,255,1)');gr.addColorStop(.35,'rgba(150,200,255,.55)');gr.addColorStop(1,'rgba(150,200,255,0)');
        ctx.fillStyle=gr;ctx.beginPath();ctx.arc(q[0],q[1],r*2.4,0,TAU);ctx.fill();
      }
    }
    ctx.restore();
  }

  /* 字形 */
  for(const g of GL){
    let x0=0,y0=0,gi=1,rr=0,ang=0;
    if(g.treeOnly&&(p<=P_END||g.tx==null)) continue;
    if(!g.extra){
      ang=g.a0+ringRot(g.ri,Math.max(t,0));
      x0=Math.cos(ang)*g.r;y0=Math.sin(ang)*g.r;
      gi=ss(clamp((B-g.d*.5)/.5));
      rr=wrapA(ang+Math.PI/2)*(1-gi);
    }else if(p<P_END-.03&&Math.abs((g.kind?Y0+g.rung*DY:g.yy)-cs.ty)>4.4) continue;
    let x1,y1,z1,sz1=g.endSz,yk;
    if(g.treeOnly){x1=g.sx;y1=g.sy;z1=g.sz0;yk=0;}
    else if(!g.kind){const pt=strandPt(g.strand,g.yy);x1=pt[0];y1=pt[1];z1=pt[2];yk=g.yy;}
    else{
      yk=Y0+g.rung*DY;
      const A=strandPt(0,yk),Bp=strandPt(1,yk),tj=(g.j+.5)/PER;
      x1=lerp(A[0],Bp[0],tj);y1=lerp(A[1],Bp[1],tj);z1=lerp(A[2],Bp[2],tj);
    }
    const sw=Math.sin(gi*Math.PI);
    let x=g.extra?x1:lerp(x0,x1,gi)+sw*g.sw,y=g.extra?y1:lerp(y0,y1,gi),z=g.extra?z1:lerp(0,z1,gi)+sw*g.swz;
    let gsz=g.extra?sz1:lerp(g.sz,sz1,gi),ti=0,fadeOut=1,flowA=1;
    if(p>P_END){
      if(g.tx==null) fadeOut=1-ss(clamp((p-P_END)/.06));
      else{
        ti=ss(clamp((clamp((p-P_END-.012)/.1)*1.6-g.td*.6)/.4));
        const sw2=Math.sin(ti*Math.PI);
        let gx=g.tx,gy=g.ty,gz=g.tz;
        if(g.fl){
          const f=g.fl,tt=frac(f.t+secs*f.spd/Math.max(.15,f.L));
          gx=lerp(f.x0,f.x1,tt)+f.ox;gy=lerp(f.y0,f.y1,tt)+f.oy;gz=lerp(f.z0,f.z1,tt)+f.oz;
          flowA=clamp(Math.min(tt,1-tt)*9);
        }else{
          const pl=1+.028*Math.sin(secs*.85-g.lr*2.6);           // 树冠由内向外缓缓脉动
          gx*=pl;gz*=pl;gy=TV.cy+(gy-TV.cy)*pl;
          gx+=Math.cos(secs*g.lw+g.lp)*.035;gy+=Math.sin(secs*g.lw*1.3+g.lp)*.028;gz+=Math.sin(secs*g.lw*.8+g.lp*2)*.035;
          if(g.dr){const u=frac(g.lp/TAU+secs*Math.abs(g.dr));gy+=(g.dr<0?.5-u:u-.5)*g.dd;flowA=clamp(Math.min(u,1-u)*6);}
        }
        const hh=clamp((g.ground-gy)/2.4);
        gx+=Math.sin(secs*.5+gy*.9)*.045*hh*hh;gz+=Math.cos(secs*.41+gy*.7)*.03*hh*hh;
        const ya=TV.yaw+secs*.05,cY=Math.cos(ya),sY=Math.sin(ya),rx=gx*cY+gz*sY;gz=-gx*sY+gz*cY;gx=rx;
        x=lerp(x,gx,ti)+sw2*(g.sw||.3)*.7;y=lerp(y,gy,ti);z=lerp(z,gz,ti)+sw2*(g.swz||.3)*.7;gsz=lerp(gsz,g.tsz,ti);
      }
    }
    const q=project(x,y,z,cs);
    if(q[3]<.4) continue;
    let glow=0;
    if(ti>.5){
      for(const b of TV.bursts){
        const dx=q[0]-b.x,dy=q[1]-b.y,d=Math.hypot(dx,dy);
        if(d<b.R){const f=1-d/b.R,ag=(now-b.t)/1000;
          const out=ag<.35?1-Math.pow(1-ag/.35,3):1-ss(clamp((ag-.35)/2.3));   // 迅速飞散，再慢慢回来
          const push=(30+95*f)*(.6+.4*Math.sin(g.lp*3.1))*out,dl=Math.max(1,d);
          const tw2=g.lp+out*1.2;
          q[0]+=(dx/dl*Math.cos(tw2*.3)-dy/dl*Math.sin(tw2*.3)*.35)*push;q[1]+=(dy/dl+dx/dl*Math.sin(tw2*.3)*.35)*push;
          glow=Math.max(glow,f*.8*out);}
      }
      if(TV.hov>.01){const dx=q[0]-TV.hx,dy=q[1]-TV.hy,d=Math.hypot(dx,dy);
        if(d<75){const f=(1-d/75)*TV.hov;q[0]-=dx*.2*f;q[1]-=dy*.2*f;glow=Math.max(glow,.6*f);}}
    }
    const size=gsz*q[2]*(1+glow*.25);
    if(size<2||q[0]<-30||q[0]>W+30||q[1]<-30||q[1]>H+30) continue;
    const depth=ti>0?clamp(1.15-(q[3]-cs.dd)*.42,.22,1):clamp(1.2-(q[3]-cs.dd)*.55,.25,1);
    let a=(g.extra?exA:gA)*depth*.92*fadeOut*lerp(1,flowA,ti);
    if(g.treeOnly) a*=ss(clamp((p-P_END)/.04));
    if(g.kind) a*=lerp(yearA(g.rung),1,ti);
    if(ti>0) a*=.88+.12*Math.sin(secs*2.2+(g.sw||0)*9);
    if(a<.02) continue;
    const c=Math.cos(rr),s=Math.sin(rr),w=size*SPK;
    ctx.setTransform(DPR*c,DPR*s,-DPR*s,DPR*c,q[0]*DPR,q[1]*DPR);
    const tw=Math.max(glow,g.treeOnly?0:(g.kind?lit[g.rung]*.85:tintAt(yk)*gi)*(1-ti));
    if(tw>.06){
      ctx.globalAlpha=a*(1-tw*.85);ctx.drawImage(sprite(g.ch),-w/2,-w/2,w,w);
      ctx.globalAlpha=a*tw;ctx.drawImage(sprite(g.ch,'b'),-w/2,-w/2,w,w);
    }else{ctx.globalAlpha=a;ctx.drawImage(sprite(g.ch),-w/2,-w/2,w,w);}
  }
  ctx.setTransform(DPR,0,0,DPR,0,0);

  /* 横档、节点、年份标签 */
  labelHits=[];
  if(p>.3&&dnaA>.01){
    const showA=ss(clamp((p-.36)/.1))*dnaA;
    const thisYear=new Date().getFullYear();
    for(let k=0;k<NR;k++){
      const y=Y0+k*DY,A=project(...strandPt(0,y),cs),Bq=project(...strandPt(1,y),cs);
      if(A[1]<-30||A[1]>H+30) continue;
      const ya=yearA(k)*showA,L=lit[k];
      /* 横档 */
      ctx.save();
      ctx.strokeStyle='rgba(215,225,248,'+(.12*ya)+')';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(Bq[0],Bq[1]);ctx.stroke();
      if(L>.02){
        ctx.strokeStyle='rgba(190,222,255,'+(.85*L)+')';ctx.lineWidth=1.5;ctx.shadowColor='rgba(120,180,255,1)';ctx.shadowBlur=10;
        ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(Bq[0],Bq[1]);ctx.stroke();
        /* 冷蓝节点 */
        ctx.shadowBlur=0;ctx.globalCompositeOperation='lighter';
        for(const q of [A,Bq]){
          const r=Math.max(4,.05*q[2])*(1+.12*Math.sin(secs*3));
          const gr=ctx.createRadialGradient(q[0],q[1],0,q[0],q[1],r*2.6);
          gr.addColorStop(0,'rgba(235,246,255,'+L+')');gr.addColorStop(.3,'rgba(130,190,255,'+(.75*L)+')');gr.addColorStop(1,'rgba(110,170,255,0)');
          ctx.fillStyle=gr;ctx.beginPath();ctx.arc(q[0],q[1],r*2.6,0,TAU);ctx.fill();
        }
      }
      ctx.restore();
      /* 年份标签：始终朝向镜头，贴在 DNA 右侧 */
      const lq=project(R+.15,y,0,cs),Y=birthYear+k,txt=String(Y)+yearGZ(Y);
      const sz=lerp(.04,.058,L)*lq[2],step=sz*1.12,x0=lq[0];
      const la=ya*clamp(1.2-(lq[3]-cs.dd)*.55,.25,1);
      if(la>.02&&sz>3){
        const w=sz*SPK;
        for(let j=0;j<txt.length;j++){
          ctx.setTransform(DPR,0,0,DPR,(x0+j*step+(j>=4?sz*.25:0))*DPR,lq[1]*DPR);
          ctx.globalAlpha=la;ctx.drawImage(sprite(txt[j]),-w/2,-w/2,w,w);
        }
        ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;
        const tag=k===0?'出生':(Y===thisYear?'今年':'');
        if(tag){ctx.globalAlpha=Math.min(1,la+.2);ctx.fillStyle='#bcd6ff';ctx.font='600 '+Math.max(8,sz*.62)+'px '+FONT;
          ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(tag,x0+6*step+sz*.5,lq[1]);ctx.globalAlpha=1;}
        labelHits.push({k,y:lq[1],x0:Math.min(A[0],Bq[0])-6,x1:x0+6*step});
      }
    }
  }

  /* 生命之树：冷银色微光、根中流光、被抽起的字 */
  const tA=ss(clamp((p-P_END-.07)/.08));
  if(tA>.01){
    const G=TREE.ground,ya=TV.yaw+secs*.05,cY=Math.cos(ya),sY=Math.sin(ya);
    const R3=(x,y,z)=>project(x*cY+z*sY,y,-x*sY+z*cY,cs);
    const gq=project(0,G,0,cs),cq=project(0,TV.cy,0,cs);
    TV.scx=cq[0];TV.scy=cq[1];TV.sr=Math.max(60,1.25*cq[2]);
    ctx.save();ctx.globalCompositeOperation='lighter';
    const rr=1.9*cq[2],br=.8+.2*Math.sin(secs*.85);
    const gg=ctx.createRadialGradient(cq[0],cq[1],0,cq[0],cq[1],rr);
    gg.addColorStop(0,'rgba(170,200,245,'+(.075*tA*br)+')');gg.addColorStop(1,'rgba(120,170,240,0)');
    ctx.fillStyle=gg;ctx.beginPath();ctx.arc(cq[0],cq[1],rr,0,TAU);ctx.fill();
    /* 地面一层很淡的光，像水面反光 */
    const g2=ctx.createRadialGradient(gq[0],gq[1],0,gq[0],gq[1],rr*.9);
    g2.addColorStop(0,'rgba(200,218,250,'+(.12*tA)+')');g2.addColorStop(1,'rgba(150,190,255,0)');
    ctx.setTransform(DPR,0,0,DPR*.16,0,gq[1]*DPR*(1-.16));
    ctx.fillStyle=g2;ctx.beginPath();ctx.arc(gq[0],gq[1],rr*.9,0,TAU);ctx.fill();
    ctx.setTransform(DPR,0,0,DPR,0,0);
    /* 根里的流光：从根梢流向树干 */
    for(const pu of RPULSE){
      const u=frac(pu.ph+secs*pu.sp),P3=alongPath(pu.path,u),q=R3(...P3);
      const a=tA*.32*Math.sin(u*Math.PI),r=Math.max(3,.07*q[2]);
      if(a<.02) continue;
      const g3=ctx.createRadialGradient(q[0],q[1],0,q[0],q[1],r);
      g3.addColorStop(0,'rgba(225,238,255,'+a+')');g3.addColorStop(.4,'rgba(150,195,255,'+(a*.45)+')');g3.addColorStop(1,'rgba(150,195,255,0)');
      ctx.fillStyle=g3;ctx.beginPath();ctx.arc(q[0],q[1],r,0,TAU);ctx.fill();
    }
    if(TV.orbA>.01&&!GLX.ok){
      const oy=TV.yaw*1.7;
      for(const o of ORB){
        const an=o.a+oy+secs*o.sp*.25,x=Math.cos(an)*o.r,z=Math.sin(an)*o.r,y=TV.cy+o.y+Math.sin(an*2+o.ph)*.06;
        const q=project(x,y,z,cs);if(q[3]<.4) continue;
        const sz=clamp(.005*q[2]*o.s,.45,1.6),dep=clamp(1.2-(q[3]-cs.dd)*.45,.2,1),a=TV.orbA*tA*dep*(.55+.45*Math.sin(secs*2.4+o.ph));
        if(a<.02) continue;
        if(o.hot){const an2=an-.025-.02*TV.orbA,q2=project(Math.cos(an2)*o.r,y,Math.sin(an2)*o.r,cs);
          ctx.globalAlpha=a;ctx.strokeStyle=o.b?'#a9cbff':'#ffffff';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(q2[0],q2[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();}
        ctx.globalAlpha=a*.85;ctx.fillStyle=o.b?'#9fc3ff':'#e6edff';ctx.fillRect(q[0]-sz*.5,q[1]-sz*.5,sz,sz);
      }
      ctx.globalAlpha=1;
    }
    ctx.restore();
    const sA=ss(clamp((p-P_END-.09)/.06));
    for(const st of STREAM){
      const u=frac(st.ph+secs*st.sp);
      let x,y,z;
      if(u<.4){[x,y,z]=alongPath(st.path,u/.4);}
      else{
        const v=(u-.4)/.6,yy=lerp(G-.05,st.top,v);
        const r0=.09+Math.max(0,v-.6)*st.cr*2.2,an=st.ang+v*12;
        x=Math.cos(an)*r0;z=Math.sin(an)*r0;y=yy;
      }
      const q=R3(x,y,z),sz=.042*q[2],w=sz*SPK;
      if(sz<2) continue;
      const fa=clamp(Math.min(u*10,(1-u)*6))*sA*clamp(1.15-(q[3]-cs.dd)*.42,.22,1)*.8;
      if(fa<.02) continue;
      ctx.setTransform(DPR,0,0,DPR,q[0]*DPR,q[1]*DPR);
      ctx.globalAlpha=fa;ctx.drawImage(sprite(st.ch,st.b?'b':undefined),-w/2,-w/2,w,w);
    }
    ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;
  }

  /* 翻到新的一年：几粒光点短暂聚拢到节点上 */
  if(conv.length){
    const ny=CY;
    const nodeX=(()=>{const A=project(...strandPt(0,yF),cs),Bq=project(...strandPt(1,yF),cs);return (A[0]+Bq[0])/2;})();
    ctx.save();ctx.globalCompositeOperation='lighter';
    for(let i=conv.length-1;i>=0;i--){
      const c=conv[i],u=(now-c.t0)/c.d;
      if(u>=1){conv.splice(i,1);continue;}
      const e=eo3(u),r=c.r0*(1-e),x=nodeX+Math.cos(c.a)*r,y=ny+Math.sin(c.a)*r;
      ctx.globalAlpha=Math.sin(Math.PI*Math.min(1,u*1.15))*.9;
      ctx.fillStyle='#d6ebff';ctx.beginPath();ctx.arc(x,y,1.5,0,TAU);ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha=1;ctx.setTransform(DPR,0,0,DPR,0,0);
}

/* ====================== 最后一幕的柔光粒子（WebGL / Three.js） ======================
   上万颗极小的光点围着树缓慢公转，每颗都有高斯光晕（中心亮、边缘柔化），叠加混合；
   树底有三圈同心光环慢慢向外扩散。投影和画布上的树用同一套相机公式，所以完全贴合。
   点一下：附近的光点被推开、变亮，再慢慢回来。没有 WebGL 时自动退回原来的画法。 */
const GLX={ok:false};
(function initGL(){
  try{
    if(!window.THREE) return;
    const cvs=$('gl');
    const R=new THREE.WebGLRenderer({canvas:cvs,alpha:true,antialias:false,premultipliedAlpha:false});
    R.setClearColor(0x000000,0);
    const NC=10000,NRING=3,PR=1200,N=NC+NRING*PR;
    const pos=new Float32Array(N*3),ex=new Float32Array(N*4),col=new Float32Array(N);
    const r=rng(9157),g=()=>(r()+r()+r()-1.5)/1.5;
    for(let i=0;i<N;i++){
      let kind,rad,yv,sz;

          const ph=Math.acos(2*r()-1),s=.8+Math.pow(r(),.55)*.65;
          kind=0;rad=Math.abs(Math.sin(ph))*1.5*s;yv=Math.cos(ph)*(Math.cos(ph)<0?1.0:.75)*s;
        }else if(u<.88){                             // 从树冠到地面围着整棵树的一圈
          kind=1;rad=.35+Math.pow(r(),.7)*1.35;yv=r();
        }else{                                       // 更外面稀疏的一层
          const ph=Math.acos(2*r()-1),s=1.6+r()*1.1;
          kind=0;rad=Math.abs(Math.sin(ph))*s;yv=Math.cos(ph)*s*.8;

    }

    geo.setAttribute('aEx',new THREE.BufferAttribute(ex,4));
    geo.setAttribute('aCol',new THREE.BufferAttribute(col,1));
    geo.setAttribute('aAl',new THREE.BufferAttribute(new Float32Array(N).fill(1),1));

    const NV=3600,vpos=new Float32Array(NV*3),vex=new Float32Array(NV*4),vcol=new Float32Array(NV),val=new Float32Array(NV);

      vex[i*4]=9;vex[i*4+1]=r()<.05?11+r()*8:3.6+Math.pow(r(),2)*4.4;vex[i*4+2]=0;vex[i*4+3]=r()*TAU;vcol[i]=Math.pow(r(),1.3);
    }
    const vgeo=new THREE.BufferGeometry();
    const vposA=new THREE.BufferAttribute(vpos,3),valA=new THREE.BufferAttribute(val,1);
    vposA.setUsage(THREE.DynamicDrawUsage);valA.setUsage(THREE.DynamicDrawUsage);
    vgeo.setAttribute('position',vposA);vgeo.setAttribute('aEx',new THREE.BufferAttribute(vex,4));
    vgeo.setAttribute('aCol',new THREE.BufferAttribute(vcol,1));vgeo.setAttribute('aAl',valA);
    /* 河道：从远处左后方蜿蜒流到树根（地面上） */
    const RIVER=[[1.1,-1.2],[-.4,-1.05],[-1.0,-.8],[-.2,-.6],[.55,-.42],[.2,-.22],[0,0]];
    function riverPt(u,G){const P=RIVER.map(q=>[q[0],G,q[1]]);return alongPath(P,u);}
    function updateRiver(T){
      if(!BPATH.length) return;
      const G=TREE.ground,cy=TV.cy,ya=TV.yaw+T*.05,cY=Math.cos(ya),sY=Math.sin(ya);
      for(let i=0;i<NV;i++){
        const q=RV[i],u=frac(q.ph+T*q.sp);let x,y,z,al=1;
        if(u<.45){                                   // 在河里顺流而下
          const s=u/.45,P=riverPt(s,G),P2=riverPt(Math.min(1,s+.01),G);
          let tx=P2[0]-P[0],tz=P2[2]-P[2];const l=Math.hypot(tx,tz)||1;tx/=l;tz/=l;

          const s=(u-.78)/.22,ch=BPATH[q.bp%BPATH.length],tp=ch[ch.length-1];
          const an=q.ao+T*q.wo,ox=Math.cos(an)*q.ro,oz=Math.sin(an)*q.ro,oy=cy+q.yo;
          const e=ss(Math.min(1,s*2.4));x=lerp(tp[0],ox,e);y=lerp(tp[1],oy,e);z=lerp(tp[2],oz,e);
          al=1-ss(clamp((s-.75)/.25));
        }
        vpos[i*3]=x;vpos[i*3+1]=y;vpos[i*3+2]=z;val[i]=al;
      }
      vposA.needsUpdate=true;valA.needsUpdate=true;
    }
    const U={uT:{value:0},uYaw:{value:0},uTy:{value:0},uTx:{value:0},uDd:{value:3},uDy:{value:0},uCyaw:{value:1},uSyaw:{value:0},
      uCp:{value:1},uSp:{value:0},uS:{value:1},uC:{value:new THREE.Vector2()},uRes:{value:new THREE.Vector2(1,1)},uDpr:{value:1},
      uCy:{value:0},uG:{value:0},uA:{value:0},uKref:{value:1},uB:{value:[0,1,2,3].map(()=>new THREE.Vector4(0,0,0,0))}};
    const mat=new THREE.ShaderMaterial({uniforms:U,transparent:true,depthTest:false,depthWrite:false,blending:THREE.AdditiveBlending,
      vertexShader:`
        attribute vec4 aEx;attribute float aCol;attribute float aAl;
        uniform float uT,uYaw,uTy,uTx,uDd,uDy,uCyaw,uSyaw,uCp,uSp,uS,uDpr,uCy,uG,uA,uKref;
        uniform vec2 uC,uRes;uniform vec4 uB[4];
        varying float vA;varying vec3 vC;varying float vHot;
        void main(){
          float kind=aEx.x,th=position.y+uT*aEx.z,a=1.0;vec3 w;
          if(kind>8.5){w=position;a=aAl;}
          else if(kind<0.5){w=vec3(cos(th)*position.x,uCy+position.z+sin(uT*0.7+aEx.w)*0.035,sin(th)*position.x);}
          else if(kind<1.5){w=vec3(cos(th)*position.x,mix(uCy,uG,position.z)+sin(uT*0.6+aEx.w)*0.03,sin(th)*position.x);}
          else{float ph=fract(uT*0.065+(kind-2.0)/3.0);float rr=mix(0.15,2.7,ph)+position.x;
            w=vec3(cos(th)*rr,uG+position.z,sin(th)*rr);a=smoothstep(0.0,0.1,ph)*(1.0-smoothstep(0.45,1.0,ph));}
          float cY=cos(uYaw),sY=sin(uYaw);
          float rx=w.x*cY+w.z*sY,rz=-w.x*sY+w.z*cY;
          float yy=w.y-uTy,xx=rx-uTx;
          float x1=xx*uCyaw+rz*uSyaw,z1=-xx*uSyaw+rz*uCyaw;
          float y2=yy*uCp-z1*uSp,z2=yy*uSp+z1*uCp;
          float zc=z2+uDd;
          if(zc<0.4){gl_Position=vec4(2.0,2.0,2.0,1.0);gl_PointSize=0.0;vA=0.0;return;}
          float k=uS/zc;vec2 sc=vec2(uC.x+x1*k,uC.y+uDy+y2*k);
          float glow=0.0;
          for(int j=0;j<4;j++){vec4 b=uB[j];if(b.w<=0.0)continue;
            vec2 dv=sc-b.xy;float d=length(dv);
            if(d<b.w){float f=1.0-d/b.w,ag=b.z;
              float o=ag<0.35?1.0-pow(1.0-ag/0.35,3.0):1.0-smoothstep(0.35,2.65,ag);
              sc+=dv/max(d,1.0)*(8.0+55.0*f)*o;glow=max(glow,f*o);}}
          float dep=clamp(1.2-(zc-uDd)*0.42,0.25,1.0);
          vA=uA*a*dep*(0.7+0.3*sin(uT*2.3+aEx.w*7.0))*(1.0+glow*0.9)*0.9;
          vC=mix(vec3(1.0),vec3(0.70,0.83,1.0),aCol);vHot=glow;
          gl_PointSize=aEx.y*uDpr*clamp(k/uKref,0.6,1.9)*(1.0+glow*0.7);
          gl_Position=vec4(sc.x/uRes.x*2.0-1.0,1.0-sc.y/uRes.y*2.0,0.0,1.0);
        }`,
      fragmentShader:`
        precision mediump float;varying float vA;varying vec3 vC;varying float vHot;
        void main(){vec2 p=gl_PointCoord-0.5;float d2=dot(p,p)*4.0;
          float core=exp(-d2*42.0),halo=exp(-d2*6.5)*0.38+exp(-d2*2.2)*0.16;
          float a=(core+halo)*vA;if(a<0.003)discard;
          vec3 c=mix(mix(vC,vec3(0.80,0.88,1.0),0.35*(1.0-core)),vec3(0.78,0.88,1.0),vHot*0.5)*(1.0+core*0.6);
          gl_FragColor=vec4(c,a);}`});
    const scene=new THREE.Scene(),cam=new THREE.Camera(),pts=new THREE.Points(geo,mat);
    pts.frustumCulled=false;scene.add(pts);
    const riv=new THREE.Points(vgeo,mat);riv.frustumCulled=false;scene.add(riv);
    let shown=false;
    GLX.resize=()=>{R.setPixelRatio(DPR);R.setSize(W,H,false);};
    GLX.frame=(now,p,cs)=>{
      const a=ss(clamp((p-P_END-.07)/.08));
      if(a<.004){if(shown){R.clear();shown=false;}return;}
      shown=true;const secs=now/1000;updateRiver(secs);
      U.uT.value=secs;U.uYaw.value=TV.yaw+secs*.05;U.uTy.value=cs.ty;U.uTx.value=cs.tx;U.uDd.value=cs.dd;U.uDy.value=cs.dy;
      U.uCyaw.value=cs.cyaw;U.uSyaw.value=cs.syaw;U.uCp.value=cs.cp;U.uSp.value=cs.sp;U.uS.value=S*DD0;
      U.uC.value.set(CX,CY);U.uRes.value.set(W,H);U.uDpr.value=DPR;U.uCy.value=TV.cy;U.uG.value=TREE.ground;U.uA.value=a;
      U.uKref.value=S*DD0/Math.max(.1,TREE.dd||3);
      for(let j=0;j<4;j++){const b=TV.bursts[TV.bursts.length-1-j];
        if(b) U.uB.value[j].set(b.x,b.y,(now-b.t)/1000,b.R*1.15); else U.uB.value[j].set(0,0,0,0);}
      R.render(scene,cam);
    };
    GLX.ok=true;
  }catch(e){GLX.ok=false;}
})();
requestAnimationFrame(frame);
})();
